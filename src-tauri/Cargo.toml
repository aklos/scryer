[package]
name = "scryer"
version = "0.3.7"
description = "Visual architecture planning tool for AI-assisted software design"
authors = ["Alexander Klos"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scryer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.9", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
scryer-core = { path = "../crates/scryer-core" }
scryer-acp = { path = "../crates/scryer-acp" }
scryer-extract = { path = "../crates/scryer-extract" }
notify = "6"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time"] }
which = "7"
dirs = "6.0.0"
toml_edit = "0.22"
tauri-plugin-dialog = "2"

# In-process symbol resolution + syntax highlighting for the code inspector.
# Grammars are compiled into the app — no external binary required.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"


[dev-dependencies]
tempfile = "3"
