[package]
name = "scryer-core"
version = "0.4.1"
edition = "2021"
description = "Core data model and file I/O for Scryer"
authors = ["Alexander Klos"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
schemars = "1"
ignore = "0.4"
glob = "0.3"
roxmltree = "0.21.1"

[dev-dependencies]
tempfile = "3"
