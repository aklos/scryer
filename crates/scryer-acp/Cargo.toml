[package]
name = "scryer-acp"
version = "0.4.21"
edition = "2021"
description = "Agent runtime for Scryer — spawns and drives AI coding agent subprocesses"
authors = ["Alexander Klos"]

[dependencies]
agent-client-protocol = "0.10"
tokio = { version = "1", features = ["rt", "sync", "process", "macros", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
scryer-core = { path = "../scryer-core" }
tempfile = "3"
