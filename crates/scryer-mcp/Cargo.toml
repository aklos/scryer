[package]
name = "scryer-mcp"
version = "0.3.3"
edition = "2021"
description = "MCP server for Scryer architecture models"
authors = ["Alexander Klos"]

[[bin]]
name = "scryer-mcp"
path = "src/main.rs"

[dependencies]
scryer-core = { path = "../scryer-core" }
scryer-extract = { path = "../scryer-extract" }
rmcp = { version = "0.15", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22.1"
toml_edit = "0.22"
glob = "0.3.3"
strsim = "0.11"

# Liveness probe for the discovery file's pid — refuse a crashed app's stale
# endpoint before handing it the token. Both are already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
