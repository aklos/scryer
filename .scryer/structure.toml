# How scryer reads this repo's shape. Containers, components and claims are
# derived from packaging and tests; this file says only what the code cannot.

[system]
name = "Scryer"
persons = ["developer", "agent"]
externals = ["claude code", "codex", "copilot cli"]

# Readable names. Everything else refers to a person or external by its key
# under [system], so renaming one changes only its name here.
[persons.developer]
name = "Developer"

[persons.agent]
name = "Coding Agent"

[externals."claude code"]
name = "Claude Code"

[externals.codex]
name = "Codex"

[externals."copilot cli"]
name = "Copilot CLI"

# Who uses scryer and how. A relationship that names a container sits on it
# and is lifted to the system for the context map. Containers are named by
# their key under [containers], never their display name, so a rename breaks
# nothing; the UI's key is "scryer", the system's name too, so it alone goes
# by its display name here.
[relationships]
developer = [
  { to = "Desktop App UI", label = "reads claims, their status and health in" },
  { to = "crates/scryer-mcp", label = "turns on agent integration and runs check with" },
]
agent = [{ to = "crates/scryer-mcp", label = "orients, reads the tree and reports test runs and probes over MCP" }]
"claude code" = [{ to = "crates/scryer-mcp", label = "launches as its MCP server and session hook" }]
codex = [{ to = "crates/scryer-mcp", label = "launches as its MCP server and session hook" }]
"copilot cli" = [{ to = "crates/scryer-mcp", label = "launches as its MCP server and session hook" }]
"src-tauri" = [{ to = "preview", label = "runs with node as its preview sidecar" }]
"Desktop App UI" = [{ to = "preview", label = "frames component previews from" }]

[levels]
e2e = ["e2e/**", "tests/e2e/**"]
integration = ["crates/*/tests/**", "src-tauri/tests/**"]
# everything else is unit

# Display names and styles carried over from the authored model.
#
# A style is a claim about the code's shape. When a container's code does not
# have the declared shape, fix it by declaring the shape the code actually has
# (or none), not by inventing directories. When the code has the shape, a
# violation is fixed by moving the offending files.

[containers.scryer]
name = "Desktop App UI"
style = "feature-sliced"

[containers.src-tauri]
name = "Desktop App Host"
style = "core-shell"

[containers."crates/scryer-core"]
name = "Model Core"
style = "library"
layers = ["domain", "application", "composition", "infrastructure"]

[containers."crates/scryer-extract"]
name = "Code Extractor"
style = "library"
layers = ["domain", "application", "composition", "infrastructure"]

[containers."crates/scryer-acp"]
name = "Agent Sync"
style = "library"
layers = ["domain", "application", "composition", "infrastructure"]
uses = [
  { to = "claude code", label = "runs claude -p to write preview fixtures" },
  { to = "codex", label = "runs codex exec to write preview fixtures" },
  { to = "copilot cli", label = "drives over ACP to write preview fixtures" },
]

# No style, honestly: the server was declared core-shell, but its modules
# are flat files under src/ (server, cli, hook_client, tools, derived,
# helpers, types, instructions) with no shell/core split for the style to
# read. Choosing the shape it should take is a refactor of its own; until
# then check reports it as the one unstyled container.
[containers."crates/scryer-mcp"]
name = "MCP Server"

[containers."crates/xtask"]
name = "Build Tasks"
style = "core-shell"

# The docs site was declared feature-sliced, which its code never was: it is
# an Astro Starlight site, laid out the way Astro documents src/ (components
# embedded by content collections). That is the shape declared here, as the
# project style .scryer/styles/astro.json.
[containers.docs]
name = "Docs Site"
style = "astro"

# Dev tooling built on the app's own modules: the Remotion demo film (and its
# reel) and the static export viewer. They stay on the
# map, need no style, and may import any layer of the app.
[containers.demo]
name = "Demo Film"
tooling = true

[containers."demo/reel"]
name = "Demo Reel"
tooling = true

[containers.export-viewer]
name = "Export Viewer"
tooling = true

# The node sidecar the Rust host runs to render component previews. It has no
# manifest of its own, so it is declared a container here.
[containers.preview]
name = "Preview Server"
