# How scryer reads this repo's shape. Containers, components and claims are
# derived from packaging and tests; this file says only what the code cannot.

[system]
name = "scryer"
persons = ["developer", "agent"]
externals = ["claude code", "codex", "copilot cli"]

# Who uses scryer and how. A relationship that names a container sits on it
# and is lifted to the system for the context map.
[relationships]
developer = [
  { to = "Desktop App UI", label = "reads claims, their status and health in" },
  { to = "MCP Server", label = "turns on agent integration and runs check with" },
]
agent = [{ to = "MCP Server", label = "orients, reads the tree and reports test runs and probes over MCP" }]
"claude code" = [{ to = "MCP Server", label = "launches as its MCP server and session hook" }]
codex = [{ to = "MCP Server", label = "launches as its MCP server and session hook" }]
"copilot cli" = [{ to = "MCP Server", label = "launches as its MCP server and session hook" }]

[levels]
e2e = ["e2e/**", "tests/e2e/**"]
integration = ["crates/*/tests/**", "src-tauri/tests/**"]
# everything else is unit

# Display names and styles carried over from the authored model.
#
# A style is a claim about the code's shape. When a container's code does not
# have the declared shape, fix it by declaring the shape the code actually has
# (or none), not by inventing directories. When the code has the shape, a
# violation is fixed by moving the offending files.

[containers.scryer]
name = "Desktop App UI"
style = "feature-sliced"

[containers.src-tauri]
name = "Desktop App Host"
style = "core-shell"

[containers."crates/scryer-core"]
name = "Model Core"
style = "library"
layers = ["domain", "application", "composition", "infrastructure"]

[containers."crates/scryer-extract"]
name = "Code Extractor"
style = "library"
layers = ["domain", "application", "composition", "infrastructure"]

[containers."crates/scryer-acp"]
name = "Agent Sync"
style = "library"
layers = ["domain", "application", "composition", "infrastructure"]
uses = [
  { to = "claude code", label = "runs claude -p to write preview fixtures" },
  { to = "codex", label = "runs codex exec to write preview fixtures" },
  { to = "copilot cli", label = "drives over ACP to write preview fixtures" },
]

# No style, honestly: the server was declared core-shell, but its modules
# are flat files under src/ (server, cli, hook_client, tools, derived,
# helpers, types, instructions) with no shell/core split for the style to
# read. Choosing the shape it should take is a refactor of its own; until
# then check reports it as the one unstyled container.
[containers."crates/scryer-mcp"]
name = "MCP Server"

[containers."crates/xtask"]
name = "Build Tasks"
style = "core-shell"

# The docs site was declared feature-sliced, which its code never was: it is
# an Astro Starlight site, laid out the way Astro documents src/ (components
# embedded by content collections). That is the shape declared here, as the
# project style .scryer/styles/astro.json.
[containers.docs]
name = "Docs Site"
style = "astro"
