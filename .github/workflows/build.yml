name: Build

# Builds the desktop app for every platform and uploads the bundles to a
# draft GitHub release for `tag`. Normally invoked by release.yml, which
# creates the tag first; a tag pushed by hand triggers it directly.

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Tag to build and release (e.g. v0.3.11)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # No version pin here — the action reads package.json's packageManager
      # field, so contributors and CI resolve the same pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build MCP sidecar
        shell: bash
        run: |
          cargo build --release -p scryer-mcp --target ${{ matrix.target }}
          mkdir -p src-tauri/binaries
          src="target/${{ matrix.target }}/release/scryer-mcp"
          dst="src-tauri/binaries/scryer-mcp-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "${src}.exe" "${dst}.exe"
          else
            cp "$src" "$dst"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'scryer ${{ inputs.tag || github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
