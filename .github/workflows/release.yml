name: Release

# Releases the current main snapshot. The patch number counts merges: it is
# the previous release's patch plus the number of first-parent commits on
# main since that tag (its own "Bump version" commits excluded). The version
# fields are rewritten, committed, tagged, and the tag is built.
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the build
# is invoked here as a reusable workflow rather than relying on its tag trigger.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute the version
        id: version
        run: |
          current=$(node -p "require('./package.json').version")
          IFS=. read -r major minor _ <<< "$current"
          latest=$(git tag --list "v$major.$minor.*" --sort=-v:refname | head -n1)
          if [[ -z "$latest" ]]; then
            echo "::error::no v$major.$minor.* tag to count from; run the Bump workflow first"
            exit 1
          fi
          IFS=. read -r _ _ latest_patch <<< "${latest#v}"
          merges=$(git rev-list --first-parent --count \
            --invert-grep --grep='^Bump version to' "$latest..HEAD")
          if [[ "$(git rev-parse "$latest")" == "$(git rev-parse HEAD)" ]]; then
            # main is exactly the tag (e.g. right after a Bump): build it as-is.
            echo "main is already tagged as $latest; building that"
            echo "retag=false" >> "$GITHUB_OUTPUT"
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target="$major.$minor.$((latest_patch + merges))"
          echo "$latest + $merges merge(s) -> v$target"
          echo "retag=true" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "tag=v$target" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.retag == 'true'

      # bump-version.sh updates Cargo.lock offline; give it the index and crates.
      - run: cargo fetch
        if: steps.version.outputs.retag == 'true'

      - name: Rewrite version fields, commit and tag
        if: steps.version.outputs.retag == 'true'
        run: |
          target='${{ steps.version.outputs.target }}'
          scripts/bump-version.sh "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Bump version to $target"
          git tag "v$target"
          git push origin main "v$target"

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
