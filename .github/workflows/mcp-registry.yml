name: MCP Registry

# Lists the release in the MCP Registry once it is published: server.json
# pointed at that release's scryer-mcp.mcpb, with the bundle's hash. Only a
# published release's assets download, so this waits for publication, not
# for build.yml's draft.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to list (e.g. v0.4.22)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the registry's GitHub OIDC login
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Point server.json at the release's bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern scryer-mcp.mcpb --repo '${{ github.repository }}'
          sha="$(sha256sum scryer-mcp.mcpb | cut -d' ' -f1)"
          version="${TAG#v}"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/scryer-mcp.mcpb"
          jq --arg v "$version" --arg u "$url" --arg s "$sha" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
